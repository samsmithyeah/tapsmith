name: E2E iOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: e2e-ios-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  SHARD_TOTAL: 5

jobs:
  # ─── Build prerequisites (parallel) ────────────────────────────────────

  build-daemon:
    name: Build Daemon
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: brew install protobuf

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/tapsmith-core/target
          key: ${{ runner.os }}-cargo-e2e-${{
            hashFiles('packages/tapsmith-core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-e2e-

      - name: Build release binary
        working-directory: packages/tapsmith-core
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: daemon-binary-macos
          retention-days: 1
          # tapsmith-ios-hid rides along: the daemon resolves it as a sibling
          # binary and uses it for real-input touch injection (streamed drags,
          # double-tap on iOS 26 runtimes that coalesce synthesized taps).
          path: |
            packages/tapsmith-core/target/release/tapsmith-core
            packages/tapsmith-core/target/release/tapsmith-ios-hid

  build-agent:
    name: Build Agent
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Generate Xcode project
        working-directory: ios-agent
        run: |
          brew install xcodegen 2>/dev/null || true
          ./create-xcode-project.sh

      - name: Build for testing
        working-directory: ios-agent
        run: |
          xcodebuild build-for-testing \
            -project TapsmithAgent.xcodeproj \
            -scheme TapsmithAgentUITests \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build-sim \
            -quiet

      - uses: actions/upload-artifact@v4
        with:
          name: ios-agent-build
          retention-days: 1
          include-hidden-files: true
          path: ios-agent/.build-sim/

  build-test-app:
    name: Build Test App
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Cache test app
        id: test-app-cache
        uses: actions/cache@v4
        with:
          path: e2e/fixtures/TapsmithTestApp.app
          key: test-app-ios-${{ hashFiles('test-app/app/**', 'test-app/assets/**',
            'test-app/package-lock.json', 'test-app/app.json') }}

      - uses: actions/setup-node@v4
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        with:
          node-version: 24

      - name: Install dependencies and prebuild
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        working-directory: test-app
        run: |
          npm ci --legacy-peer-deps
          npx expo prebuild --platform ios

      - name: Install CocoaPods
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        working-directory: test-app/ios
        run: pod install

      - name: Build for iOS Simulator
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        working-directory: test-app/ios
        run: |
          xcodebuild build \
            -workspace TapsmithTestApp.xcworkspace \
            -scheme TapsmithTestApp \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ../.build \
            -quiet

      - name: Copy to fixtures path
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p e2e/fixtures
          cp -R test-app/.build/Build/Products/Release-iphonesimulator/TapsmithTestApp.app e2e/fixtures/

      - name: Package test app
        run: tar czf test-app-ios.tar.gz -C e2e/fixtures TapsmithTestApp.app

      - uses: actions/upload-artifact@v4
        with:
          name: test-app-ios
          retention-days: 1
          path: test-app-ios.tar.gz

  # ─── Sharded E2E execution ─────────────────────────────────────────────

  e2e-test:
    name: "Shard ${{ matrix.shard }}/5"
    needs: [ build-daemon, build-agent, build-test-app ]
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3, 4, 5 ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/tapsmith/package-lock.json
            e2e/package-lock.json

      # Kick the boot off early and don't wait: the simulator reaches Booted
      # (~1-3 min on these runners) while the download/npm/build steps below
      # run. "Wait for simulator boot" gates on it just before the tests.
      - name: Select Xcode and start simulator boot
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          SIM=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+ " | head -1 | xargs)
          echo "Using simulator: $SIM"
          echo "TAPSMITH_IOS_SIMULATOR=$SIM" >> $GITHUB_ENV
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for devs in d['devices'].values():
            for dev in devs:
              if dev['name']=='$SIM' and dev['isAvailable']:
                print(dev['udid']); sys.exit()
          ")
          if [ -n "$UDID" ]; then
            echo "Booting $SIM ($UDID)"
            echo "TAPSMITH_IOS_UDID=$UDID" >> $GITHUB_ENV
            xcrun simctl boot "$UDID" 2>/dev/null || true
          fi

      - name: Download daemon binary
        uses: actions/download-artifact@v4
        with:
          name: daemon-binary-macos
          path: packages/tapsmith-core/target/release

      - name: Download iOS agent
        uses: actions/download-artifact@v4
        with:
          name: ios-agent-build
          path: ios-agent/.build-sim

      - name: Download test app
        uses: actions/download-artifact@v4
        with:
          name: test-app-ios
          path: .

      - name: Make daemon executable
        run: |
          chmod +x packages/tapsmith-core/target/release/tapsmith-core
          xattr -d com.apple.quarantine packages/tapsmith-core/target/release/tapsmith-core 2>/dev/null || true
          if [ -f packages/tapsmith-core/target/release/tapsmith-ios-hid ]; then
            chmod +x packages/tapsmith-core/target/release/tapsmith-ios-hid
            xattr -d com.apple.quarantine packages/tapsmith-core/target/release/tapsmith-ios-hid 2>/dev/null || true
          fi

      - name: Resolve xctestrun path
        run: |
          XCTESTRUN=$(find "$PWD/ios-agent/.build-sim" -name "*.xctestrun" -type f -print -quit)
          if [ -z "$XCTESTRUN" ]; then
            echo "::error::No xctestrun found under ios-agent/.build-sim"
            exit 1
          fi
          echo "TAPSMITH_IOS_XCTESTRUN=$XCTESTRUN" >> $GITHUB_ENV
          echo "Resolved xctestrun: $XCTESTRUN"

      - name: Extract test app
        run: |
          mkdir -p e2e/fixtures
          tar xzf test-app-ios.tar.gz -C e2e/fixtures

      - name: Install SDK dependencies
        working-directory: packages/tapsmith
        run: npm ci

      - name: Build SDK
        working-directory: packages/tapsmith
        run: npm run build

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Wait for simulator boot
        run: |
          if [ -z "$TAPSMITH_IOS_UDID" ]; then
            echo "No simulator UDID resolved; skipping wait."
            exit 0
          fi
          TIMEOUT=120
          while [ $TIMEOUT -gt 0 ]; do
            STATE=$(xcrun simctl list devices -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for devs in d['devices'].values():
            for dev in devs:
              if dev['udid']=='$TAPSMITH_IOS_UDID':
                print(dev['state']); sys.exit()
          ")
            if [ "$STATE" = "Booted" ]; then break; fi
            sleep 2
            TIMEOUT=$((TIMEOUT - 2))
          done
          echo "Simulator state: $STATE"

      - name: Run E2E tests
        working-directory: e2e
        env:
          # Capture a per-shard timing breakdown (agent boot vs. per-command
          # device latency vs. app reset) for performance tracking. The daemon
          # appends one line per event when this var is set; it's a no-op
          # otherwise, so this adds only negligible file I/O.
          TAPSMITH_TIMING_LOG: ${{ runner.temp }}/ios-timing-${{ matrix.shard }}.log
          TAPSMITH_DAEMON_LOG: /tmp/tapsmith-daemon-ios-${{ matrix.shard }}.log
        run: |
          npx tapsmith test -c tapsmith.config.ios-ci.mjs --shard=${{ matrix.shard }}/${{ env.SHARD_TOTAL }} --workers 1

      - name: Summarize iOS timing breakdown
        if: always()
        run: |
          LOG="${{ runner.temp }}/ios-timing-${{ matrix.shard }}.log"
          if [ ! -f "$LOG" ]; then
            echo "No timing log produced for shard ${{ matrix.shard }}."
            exit 0
          fi
          {
            echo "### iOS timing — shard ${{ matrix.shard }}/${{ env.SHARD_TOTAL }}"
            echo '```'
            echo "Boot / reset:"
            grep -E "kind=boot|kind=reset" "$LOG" || true
            echo
            echo "Per-command (count / total_ms / avg_ms), sorted by total:"
            grep "kind=cmd" "$LOG" \
              | sed -E 's/.*name=([a-zA-Z]+) dur_ms=([0-9]+).*/\1 \2/' \
              | awk '{c[$1]++; s[$1]+=$2}
                     END {for (k in c) printf "  %-16s n=%-5d total=%-8d avg=%.0f\n", k, c[k], s[k], s[k]/c[k]}' \
              | sort -t= -k3 -rn
            echo
            grep "kind=cmd" "$LOG" | sed -E 's/.*dur_ms=([0-9]+).*/\1/' \
              | awk '{s+=$1} END {printf "  Total command time: %d ms across %d commands\n", s, NR}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload timing log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-timing-${{ matrix.shard }}
          retention-days: 7
          path: ${{ runner.temp }}/ios-timing-${{ matrix.shard }}.log
          if-no-files-found: ignore

      - name: Print daemon deep-link diagnostics
        if: always()
        run: |
          found=0
          mkdir -p e2e/tapsmith-results
          for log in /tmp/tapsmith-daemon-ios-${{ matrix.shard }}*.log; do
            [ -e "$log" ] || continue
            found=1
            cp "$log" "e2e/tapsmith-results/$(basename "$log")"
            echo "::group::$(basename "$log") deep-link excerpts"
            grep -Ei "Open-in-app|openurl hit|Operation timed out opening URL|simctl openurl task failed|Failed to open URL" "$log" || true
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "No daemon logs found."
          fi

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-ios-${{ matrix.shard }}
          retention-days: 7
          path: e2e/blob-report/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ios-${{ matrix.shard }}
          retention-days: 7
          path: |
            e2e/tapsmith-results/
            !e2e/tapsmith-results/**/*.tar.gz

  # ─── Merge shard reports ───────────────────────────────────────────────

  e2e-report:
    name: Merge Reports
    needs: [ e2e-test ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/tapsmith/package-lock.json

      - name: Install and build SDK
        working-directory: packages/tapsmith
        run: npm ci && npm run build

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-ios-*
          path: all-blob-reports
          merge-multiple: true

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Merge reports
        working-directory: e2e
        run: npx tapsmith merge-reports ../all-blob-reports -c
          tapsmith.config.ios-ci.mjs

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ios-report
          retention-days: 30
          path: e2e/tapsmith-report/
