name: Trace Perf Diagnostic

# Temporary, opt-in diagnostic to measure where tracing overhead comes from.
# Runs only when the head commit message contains "[trace-diag]". Boots a
# single emulator and times the same fixed test subset under several trace
# configurations back-to-back, so the comparison is on identical hardware.

on:
  push:
    branches: ["**"]

concurrency:
  group: trace-diag-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_API_LEVEL: "35"
  ANDROID_SYSTEM_IMAGE: "system-images;android-35;google_apis;x86_64"
  AVD_NAME: "Tapsmith_Generic_Phone_API_35"

jobs:
  build-daemon:
    if: contains(github.event.head_commit.message, '[trace-diag]')
    name: Build Daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/tapsmith-core/target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('packages/tapsmith-core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-e2e-
      - name: Build release binary
        working-directory: packages/tapsmith-core
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: daemon-binary
          retention-days: 1
          path: packages/tapsmith-core/target/release/tapsmith-core

  build-agent:
    if: contains(github.event.head_commit.message, '[trace-diag]')
    name: Build Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            agent/.gradle
          key: ${{ runner.os }}-gradle-agent-${{ hashFiles('agent/**/*.gradle.kts', 'agent/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-agent-
      - name: Build agent APKs
        working-directory: agent
        run: ./gradlew assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: agent-apks
          retention-days: 1
          path: |
            agent/app/build/outputs/apk/debug/app-debug.apk
            agent/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

  build-test-app:
    if: contains(github.event.head_commit.message, '[trace-diag]')
    name: Build Test App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache test app APK
        id: test-app-cache
        uses: actions/cache@v4
        with:
          path: test-app/android/app/build/outputs/apk/release/app-release.apk
          key: test-app-android-${{ hashFiles('test-app/app/**', 'test-app/assets/**', 'test-app/plugins/**', 'test-app/package-lock.json', 'test-app/app.json') }}
      - uses: actions/setup-node@v4
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies and prebuild
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        working-directory: test-app
        run: |
          npm ci --legacy-peer-deps
          npx expo prebuild --platform android
      - name: Build release APK
        if: steps.test-app-cache.outputs.cache-hit != 'true'
        working-directory: test-app/android
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: test-app-apk
          retention-days: 1
          path: test-app/android/app/build/outputs/apk/release/app-release.apk

  diagnostic:
    if: contains(github.event.head_commit.message, '[trace-diag]')
    name: Trace timing sweep
    needs: [build-daemon, build-agent, build-test-app]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Variants timed per repetition (space-separated) and number of reps.
      DIAG_VARIANTS: "off full no-screenshots no-snapshots no-network"
      DIAG_REPS: "3"
      # Fixed, deterministic subset of the default project.
      DIAG_SHARD: "1/5"
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Android SDK environment
        run: |
          echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "ANDROID_AVD_HOME=$HOME/.config/.android/avd" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download daemon binary
        uses: actions/download-artifact@v4
        with:
          name: daemon-binary
          path: packages/tapsmith-core/target/release

      - name: Download agent APKs
        uses: actions/download-artifact@v4
        with:
          name: agent-apks
          path: agent/app/build/outputs/apk

      - name: Download test app APK
        uses: actions/download-artifact@v4
        with:
          name: test-app-apk
          path: e2e/fixtures

      - name: Make daemon executable
        run: chmod +x packages/tapsmith-core/target/release/tapsmith-core

      - name: Cache Android system image
        id: system-image-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/system-images
          key: system-image-${{ env.ANDROID_SYSTEM_IMAGE }}-v1

      - name: Install Android system image
        if: steps.system-image-cache.outputs.cache-hit != 'true'
        run: echo "y" | sdkmanager --install "${{ env.ANDROID_SYSTEM_IMAGE }}"

      - name: Create AVD
        run: |
          echo "no" | avdmanager create avd \
            -n "${{ env.AVD_NAME }}" \
            -k "${{ env.ANDROID_SYSTEM_IMAGE }}" \
            --device "pixel_6" \
            --force

      - name: Boot emulator
        run: |
          nohup emulator -avd "${{ env.AVD_NAME }}" \
            -no-window -no-audio -no-snapshot-save \
            -gpu swiftshader_indirect \
            -no-boot-anim \
            -memory 4096 \
            &>/tmp/emulator.log &
          adb wait-for-device
          TIMEOUT=120
          while [ $TIMEOUT -gt 0 ]; do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then break; fi
            sleep 2
            TIMEOUT=$((TIMEOUT - 2))
          done
          if [ "$BOOT" != "1" ]; then
            echo "::error::Emulator failed to boot within 120s"
            tail -30 /tmp/emulator.log
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Install SDK dependencies
        working-directory: packages/tapsmith
        run: npm ci

      - name: Build SDK
        working-directory: packages/tapsmith
        run: npm run build

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Warm up (install agent + daemon once, untimed)
        working-directory: e2e
        run: |
          TAPSMITH_DIAG_TRACE=off npx tapsmith test \
            -c tapsmith.config.android-diag.mjs --shard=${DIAG_SHARD} --workers 1 \
            > /tmp/warmup.log 2>&1 || true
          echo "warmup exit handled"

      - name: Run trace timing sweep
        working-directory: e2e
        run: |
          echo "## Trace perf diagnostic (shard ${DIAG_SHARD})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| variant | rep | seconds | passed | failed |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for rep in $(seq 1 ${DIAG_REPS}); do
            for v in ${DIAG_VARIANTS}; do
              log="/tmp/diag-${v}-${rep}.log"
              start=$(date +%s%3N)
              TAPSMITH_DIAG_TRACE=$v npx tapsmith test \
                -c tapsmith.config.android-diag.mjs --shard=${DIAG_SHARD} --workers 1 \
                > "$log" 2>&1 || true
              end=$(date +%s%3N)
              secs=$(awk "BEGIN { printf \"%.1f\", ($end-$start)/1000 }")
              passed=$(grep -oE "[0-9]+ passed" "$log" | tail -1 | grep -oE "[0-9]+" || echo "?")
              failed=$(grep -oE "[0-9]+ failed" "$log" | tail -1 | grep -oE "[0-9]+" || echo "0")
              echo "DIAGRESULT variant=$v rep=$rep seconds=$secs passed=$passed failed=$failed"
              echo "| $v | $rep | $secs | $passed | $failed |" >> "$GITHUB_STEP_SUMMARY"
            done
          done

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-diag-logs
          retention-days: 7
          path: /tmp/diag-*.log
