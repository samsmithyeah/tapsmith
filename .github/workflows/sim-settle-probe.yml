name: Simulator settle probe

# THROWAWAY DIAGNOSTIC — delete this file once PILOT-303 item 2 is answered.
#
# Round 1 (run 33495969255) established what the settle is:
#   state==Booted 56 s | bootstatus 102 s | actually usable ~191 s
#   data migration 67.5 s, of which LaunchServicesMigrator alone is 48.9 s
#   top CPU: diagnosticd (sustained), then Spotlight and eight home-screen
#   widget extensions — none of which a test needs
#
# Round 2 (this run) A/Bs the two levers that came out of that: turn off
# logging persistence, and stop the widget/Spotlight/push work.
#
# Two freshly created devices so both get a true *first* boot, measured
# sequentially on one runner — concurrent boots would contend and ruin both
# numbers, and separate runners would add ~2x macOS variance to a comparison
# that needs to resolve tens of seconds.

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths: [ '.github/workflows/sim-settle-probe.yml' ]

jobs:
  probe:
    name: Settle A/B
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Select Xcode and create two fresh devices
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          sysctl -n hw.ncpu hw.memsize
          # Newest available iOS runtime, and the highest plain "iPhone N" device
          # type on it — deliberately the same choice the e2e shards make via
          # `grep -oE "iPhone [0-9]+ " | head -1` (they get iPhone 17). Sorting
          # names alphabetically instead picks "iPhone SE (3rd generation)",
          # which is not the device whose settle we care about.
          read -r RUNTIME TYPE <<< "$(xcrun simctl list -j | python3 -c "
          import json,re,sys
          d=json.load(sys.stdin)
          rts=[r for r in d['runtimes'] if r.get('isAvailable') and 'iOS' in r.get('name','')]
          rts.sort(key=lambda r: [int(p) for p in re.findall(r'\d+', r.get('version','0'))])
          rt=rts[-1]
          ok=set(dt['identifier'] for dt in rt.get('supportedDeviceTypes',[]))
          cands=[dt for dt in d['devicetypes'] if dt['identifier'] in ok]
          numbered=[(int(m.group(1)), dt) for dt in cands
                    for m in [re.fullmatch(r'iPhone (\d+)', dt['name'])] if m]
          if numbered:
            pick=max(numbered, key=lambda p: p[0])[1]
          else:
            pick=sorted((dt for dt in cands if dt['name'].startswith('iPhone')),
                        key=lambda dt: dt['name'])[-1]
          print(rt['identifier'], pick['identifier'])
          ")"
          echo "runtime=$RUNTIME"
          echo "type=$TYPE"
          A=$(xcrun simctl create probe-control "$TYPE" "$RUNTIME")
          B=$(xcrun simctl create probe-tweaked "$TYPE" "$RUNTIME")
          echo "UDID_A=$A" >> "$GITHUB_ENV"
          echo "UDID_B=$B" >> "$GITHUB_ENV"
          echo "control=$A tweaked=$B"

      - name: Measure control, then tweaked
        run: |
          set -u
          OUT="$RUNNER_TEMP/probe"
          mkdir -p "$OUT"
          DEVROOT="$HOME/Library/Developer/CoreSimulator/Devices"

          # Services the round-1 CPU ranking implicated, all in the user domain.
          # chronod is the widget scheduler — disabling it should take the eight
          # *WidgetExtension processes with it rather than needing each by name.
          DISABLE="com.apple.chronod com.apple.apsd com.apple.sociallayerd
                   com.apple.linkd com.apple.intelligenceplatformd com.apple.newsd
                   com.apple.ScreenTimeAgent com.apple.assistantd com.apple.duetexpertd
                   com.apple.siriknowledged com.apple.familycircled"

          time_list_ms() {
            python3 -c "
          import subprocess,time
          t=time.time()
          subprocess.run(['xcrun','simctl','list','devices','--json'],capture_output=True)
          print(int((time.time()-t)*1000))
          "
          }

          sample_ps() {
            local label=$1
            while :; do
              ts=$(( $(date +%s) - T0 ))
              ps -Ao pcpu=,comm= | sort -rn | head -25 | while read -r cpu cmd; do
                printf '%s %s %s\n' "$ts" "$cpu" "$(basename "$cmd")"
              done >> "$OUT/ps-$label.log"
              sleep 2
            done
          }

          # Applied as soon as `simctl spawn` answers, which is how it would be
          # deployed for real: a boot step cannot reach into a never-booted
          # device, so the earliest possible moment is just after boot returns.
          apply_tweaks() {
            local udid=$1 label=$2 svc
            for _ in $(seq 1 90); do
              if xcrun simctl spawn "$udid" log config --mode "persist:off" >/dev/null 2>&1; then
                echo "t=$(( $(date +%s) - T0 ))s log persist:off OK" >> "$OUT/tweaks-$label.log"
                break
              fi
              sleep 2
            done
            for svc in $DISABLE; do
              if xcrun simctl spawn "$udid" launchctl disable "user/501/$svc" >/dev/null 2>&1; then
                echo "t=$(( $(date +%s) - T0 ))s disabled $svc" >> "$OUT/tweaks-$label.log"
                xcrun simctl spawn "$udid" launchctl kill SIGKILL "user/501/$svc" >/dev/null 2>&1 || true
              else
                echo "t=$(( $(date +%s) - T0 ))s FAILED  $svc" >> "$OUT/tweaks-$label.log"
              fi
            done
            if xcrun simctl spawn "$udid" mdutil -i off -a >/dev/null 2>&1; then
              echo "t=$(( $(date +%s) - T0 ))s spotlight off OK" >> "$OUT/tweaks-$label.log"
            else
              echo "t=$(( $(date +%s) - T0 ))s spotlight off FAILED" >> "$OUT/tweaks-$label.log"
            fi
          }

          run_bootstatus() {
            local udid=$1 label=$2 start
            start=$(date +%s)
            ( sleep 600; pkill -f "simctl bootstatus $udid" 2>/dev/null ) &
            local guard=$!
            script -q "$OUT/bootstatus-$label.raw" \
              xcrun simctl bootstatus "$udid" -b -d >/dev/null 2>&1 || true
            kill "$guard" 2>/dev/null || true
            echo $(( $(date +%s) - start )) > "$OUT/t-bootstatus-$label"
            tr -d '\r\004' < "$OUT/bootstatus-$label.raw" \
              | perl -pe 's/\e\[[0-9;]*[a-zA-Z]//g' > "$OUT/bootstatus-$label.txt"
          }

          # "Usable" = simctl list back under 1.5 s, the same contention the SDK
          # hits. Two consecutive fast samples, so one lucky reading does not
          # declare victory early.
          find_usable() {
            local udid=$1 label=$2 ms t fast=0
            for _ in $(seq 1 90); do
              ms=$(time_list_ms)
              t=$(( $(date +%s) - T0 ))
              printf '%s %s\n' "$t" "$ms" >> "$OUT/list-$label.log"
              if [ "$ms" -lt 1500 ]; then
                fast=$(( fast + 1 ))
                if [ "$fast" -ge 2 ]; then echo "$t" > "$OUT/usable-$label"; return; fi
              else
                fast=0
              fi
              sleep 5
            done
            echo "timeout" > "$OUT/usable-$label"
          }

          measure() {
            local udid=$1 label=$2 tweak=$3
            echo "───── $label ($udid) tweak=$tweak ─────"
            du -sk "$DEVROOT/$udid" 2>/dev/null | awk '{print $1}' > "$OUT/du-before-$label"
            export T0=$(date +%s)
            sample_ps "$label" & local ps_pid=$!
            if [ "$tweak" = yes ]; then apply_tweaks "$udid" "$label" & fi
            run_bootstatus "$udid" "$label"
            find_usable "$udid" "$label"
            # Watch a little past "usable" to confirm it stays that way.
            sleep 30
            kill "$ps_pid" 2>/dev/null || true
            xcrun simctl spawn "$udid" launchctl print user/501 > "$OUT/launchctl-user-$label.txt" 2>&1 || true
            du -sk "$DEVROOT/$udid" 2>/dev/null | awk '{print $1}' > "$OUT/du-after-$label"
            echo "  bootstatus=$(cat "$OUT/t-bootstatus-$label")s usable=$(cat "$OUT/usable-$label")s"
            echo "  du $(cat "$OUT/du-before-$label")KB -> $(cat "$OUT/du-after-$label")KB"
          }

          # Control first, then shut it down and delete it so the tweaked run is
          # not measuring CoreSimulator still busy with a second booted device.
          measure "$UDID_A" control no
          xcrun simctl shutdown "$UDID_A" 2>/dev/null || true
          xcrun simctl delete "$UDID_A" 2>/dev/null || true
          sleep 20

          measure "$UDID_B" tweaked yes
          xcrun simctl shutdown "$UDID_B" 2>/dev/null || true
          xcrun simctl delete "$UDID_B" 2>/dev/null || true

      - name: Summarize
        if: always()
        run: |
          OUT="$RUNNER_TEMP/probe"
          [ -d "$OUT" ] || { echo "probe produced no output"; exit 0; }
          get() { cat "$OUT/$1" 2>/dev/null || echo '?'; }
          {
            echo "## Settle A/B — logging + widget/Spotlight/push disabled"
            echo
            echo '| metric | control | tweaked |'
            echo '| --- | --- | --- |'
            echo "| \`bootstatus -b -d\` returns (s) | $(get t-bootstatus-control) | $(get t-bootstatus-tweaked) |"
            echo "| usable — \`simctl list\` < 1.5 s (s) | $(get usable-control) | $(get usable-tweaked) |"
            echo "| device data before (KB) | $(get du-before-control) | $(get du-before-tweaked) |"
            echo "| device data after (KB) | $(get du-after-control) | $(get du-after-tweaked) |"
            echo
            echo '### Which tweaks actually applied'
            echo '```'
            cat "$OUT/tweaks-tweaked.log" 2>/dev/null || echo '(none)'
            echo '```'
            for v in control tweaked; do
              echo
              echo "### $v — simctl list latency (s since boot → ms)"
              echo '```'
              awk '{printf "  t=%-5s %s ms\n", $1, $2}' "$OUT/list-$v.log" 2>/dev/null | head -40 || echo '(none)'
              echo '```'
              echo
              echo "### $v — top CPU during the window"
              echo '```'
              awk '{c[$3]+=$2; n[$3]++} END {for (k in c) printf "%.0f %s %d\n", c[k], k, n[k]}' \
                "$OUT/ps-$v.log" 2>/dev/null \
                | sort -rn | head -18 \
                | awk '{printf "  %-34s cpu_sum=%-8s samples=%s\n", $2, $1, $3}' || echo '(none)'
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up any surviving probe devices
        if: always()
        run: |
          for u in "${UDID_A:-}" "${UDID_B:-}"; do
            [ -n "$u" ] || continue
            xcrun simctl shutdown "$u" 2>/dev/null || true
            xcrun simctl delete "$u" 2>/dev/null || true
          done
          xcrun simctl list devices | grep -E 'probe-(control|tweaked)' || echo "no probe devices left"

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-settle-probe-ab
          retention-days: 7
          path: ${{ runner.temp }}/probe/
