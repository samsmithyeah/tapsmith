name: Tag release

# Fires when a "Release vX.Y.Z" PR (labelled `release`) is merged. Reads the
# version that landed on main, tags that commit, and pushes the tag over SSH
# (deploy key) so it triggers release.yml. A tag pushed with the default
# GITHUB_TOKEN would not trigger any workflow.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  tag:
    name: Tag merged release
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    steps:
      - name: Verify RELEASE_SSH_KEY is set
        env:
          RELEASE_SSH_KEY: ${{ secrets.RELEASE_SSH_KEY }}
        run: |
          if [ -z "$RELEASE_SSH_KEY" ]; then
            echo "::error::RELEASE_SSH_KEY secret is not set; a tag pushed with GITHUB_TOKEN will not trigger release.yml. Add the deploy key (see CLAUDE.md > Releases), then push the tag manually: git tag vX.Y.Z <merge-sha> && git push origin vX.Y.Z"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          ssh-key: ${{ secrets.RELEASE_SSH_KEY }}

      - name: Create and push tag
        run: |
          VERSION=$(node -p "require('./packages/tapsmith/package.json').version")
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin; nothing to do."
            exit 0
          fi
          git config user.name "tapsmith-release[bot]"
          git config user.email "tapsmith-release@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          # Pushed over SSH (deploy key) so release.yml's tag trigger fires.
          git push origin "$TAG"
          echo "Pushed $TAG"
